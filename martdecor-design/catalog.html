<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог материалов — МАРТдекор</title>
<meta name="description" content="Каталог интерьерного салона МАРТдекор: 3D-панели, гипсовые панели, стеновые панели и рейки, акустические панели, зеркала и мебель. Цены из магазина ВКонтакте.">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
<header id="hdr"></header>

<main class="wrap">
  <nav class="crumbs" aria-label="Хлебные крошки"><a href="index.html">Главная</a><span>Каталог</span></nav>
  <h1 class="h2 ptitle" id="ptitle">Каталог материалов</h1>
  <div class="chips" id="chips"></div>

  <div class="cat-layout">
    <aside class="filters" aria-label="Фильтры">
      <div class="search"><i class="ti ti-search"></i><input id="q" type="search" placeholder="Поиск по названию или артикулу"></div>
      <div><h4>Категория</h4><div id="f-cat"></div></div>
      <div><h4>Бренд</h4><div id="f-br"></div></div>
      <div><h4>Цена, ₽</h4><div class="price-f"><input id="pmin" type="number" inputmode="numeric" placeholder="от"><input id="pmax" type="number" inputmode="numeric" placeholder="до"></div></div>
      <button class="btn btn--line btn--sm" data-reset>Сбросить фильтры</button>
      <button class="btn btn--wine btn--sm fbtn" data-close>Показать товары</button>
    </aside>

    <div>
      <div class="ctop">
        <span id="found"></span>
        <span style="display:flex;gap:8px">
          <button class="btn btn--line btn--sm fbtn" data-filters><i class="ti ti-adjustments-horizontal"></i>Фильтры</button>
          <select class="sel" id="sort" aria-label="Сортировка"><option value="pop">Сначала новые</option><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option></select>
        </span>
      </div>
      <div class="pgrid" id="grid"></div>
      <div class="more-wrap"><button class="btn btn--line" id="more">Показать ещё</button></div>
    </div>
  </div>

  <section class="sec">
    <div class="cta-band rv">
      <div><h2 class="h3">Не&nbsp;нашли нужный материал?</h2><p>В&nbsp;салоне больше 90&nbsp;брендов: обои, краски, лепной декор, каменный шпон. Опишите задачу — менеджер подберёт варианты.</p></div>
      <div class="btns"><a class="btn btn--white" href="#" data-open-pick>Подобрать материалы <i class="ti ti-arrow-right"></i></a></div>
    </div>
  </section>
</main>

<footer id="ftr"></footer>
<script src="js/typo.js"></script>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
