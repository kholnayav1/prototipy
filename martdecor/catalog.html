<body data-page="catalog">
<div id="top"></div>
<div class="wrap cat-head">
  <div class="crumbs"><a href="index.html">Главная</a> / Каталог</div>
  <h1 id="cat-title" style="font-size:clamp(40px,4.6vw,64px)">Каталог</h1>

</div>

    <input class="search" id="q" type="search" placeholder="Поиск: шпон, Orac, обои…">

  </aside>
  <div>
    <p class="demo-note">Наличие показано для&nbsp;примера.</p>
    <div class="grid" id="list"></div>
  </div>
